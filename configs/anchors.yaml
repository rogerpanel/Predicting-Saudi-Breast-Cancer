  histology: {idc: 0.913, ilc: 0.070, other: 0.017}   # Table 1: ductal 261, lobular 20, other 5 (of 286)
  er_pos: 0.573          # Table 2, p. 296: +ve 161 (57.3), -ve 120 -> 161/281
  pr_pos: 0.450          # Table 2: +ve 126 (45.0), -ve 154 -> 126/280
  her2_pos: 0.253        # Table 2: +ve 69 (25.3), -ve 204 -> 69/273
